name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        # Tests run against an in-memory SQLite DB and fake Redis stand-ins
        # (see tests/conftest.py) — no Postgres/Redis service container
        # needed here, matching how they're run locally (§8 of the README).
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
        run: python -m pytest tests/ -v

  frontend-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-typecheck]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t lead-platform-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t lead-platform-frontend:ci ./frontend
